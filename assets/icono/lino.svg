<?xml version="1.0" encoding="UTF-8"?>
<!-- Dibujo fuente del ícono de Lino: la flor de lino. De aquí salen lino.png
     (completo), lino_frente.png (solo la flor) y lino_fondo.png (solo el fondo,
     ampliado para el recorte adaptable de Android). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#142056"/>
      <stop offset="1" stop-color="#060A1F"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E9488" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EBFF"/>
      <stop offset="1" stop-color="#8196FF"/>
    </linearGradient>
    <clipPath id="recorte"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#recorte)">
    <rect width="512" height="512" fill="url(#fondo)"/>
    <circle cx="110" cy="420" r="250" fill="url(#brillo)"/>
    <g fill="url(#petalo)">
      <path d="M256 250 C212 204 212 142 256 102 C300 142 300 204 256 250 Z"/>
      <path d="M256 250 C212 204 212 142 256 102 C300 142 300 204 256 250 Z" transform="rotate(72 256 256)"/>
      <path d="M256 250 C212 204 212 142 256 102 C300 142 300 204 256 250 Z" transform="rotate(144 256 256)"/>
      <path d="M256 250 C212 204 212 142 256 102 C300 142 300 204 256 250 Z" transform="rotate(216 256 256)"/>
      <path d="M256 250 C212 204 212 142 256 102 C300 142 300 204 256 250 Z" transform="rotate(288 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="34" fill="#0B1034"/>
    <circle cx="256" cy="256" r="23" fill="#FBBF24"/>
  </g>
</svg>
